<script>
    (function() {
        document.documentElement.classList.add('js-enabled');

        document.addEventListener('DOMContentLoaded', function() {
        var main = document.querySelector('.site-main');
        var footer = document.querySelector('.site-footer');

        var navbutton = document.getElementById('nav-toggle');
        var navbar = document.getElementById('site-nav');
        var navlinks = navbar.querySelectorAll('a');
        var navtext = navbutton.querySelector('.nav-toggle__text');
        var closebutton = document.getElementById('nav_close');

        var opentext = '{{ site.data.ui.nav_open[site.active_lang] }}';
        var closetext = '{{ site.data.ui.nav_close[site.active_lang] }}';

        navbutton.hidden = false;
        closebutton.hidden = false;

        function openmenu() {
            navbar.classList.add('is-open');
            navbutton.setAttribute('aria-expanded', 'true');
            navtext.textContent = closetext;
            if (main) { main.inert = true; }
            if (footer) { footer.inert = true; }
            navbar.querySelector('a').focus();
        }

        function closemenu() {
            navbar.classList.remove('is-open');
            navbutton.setAttribute('aria-expanded', 'false');
            navtext.textContent = opentext;
            if (main) { main.inert = false; }
            if (footer) { footer.inert = false; }
        }

        navbutton.addEventListener('click', function() {
            var opened = navbutton.getAttribute('aria-expanded') === 'true';
            if (opened) { closemenu(); } else { openmenu(); }
        });

        document.addEventListener('keydown', function(keyevent) {
            if (keyevent.key === 'Escape' && navbutton.getAttribute('aria-expanded') === 'true') {
                closemenu();
                navbutton.focus();
            }
        });
        
        closebutton.addEventListener('click', function() {
            closemenu();
            navbutton.focus();
        });

        navlinks.forEach(function(link) {
            link.addEventListener('click', function() {
                closemenu();
                navbutton.focus();
            })
        });
    })})();
</script>
