<script>
    (function() {
        var saved = localStorage.getItem('theme');
        var theme;

        if (saved == 'light' || saved == 'dark') {
            theme = saved;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
        } else {
            theme = 'dark';
        }

        document.documentElement.setAttribute('data-theme', theme);
    })();
</script>
