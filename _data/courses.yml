courses:
  - name:
      es: Tutorización en Prevención de Riesgos Laborales
      en: Tutoring in Occupational Risk Prevention
    year: 2024
    center:
      es: Cadena de ferreterías (Tenerife)
      en: Hardware store chain (Tenerife)
    description:
      es: Tutorización de la plantilla a partir de los materiales oficiales de PRL, resolviendo dudas, ampliando contenidos y aclarando cuestiones difusas, en grupos reducidos. Organicé además la logística de la formación —grupos, horarios y turnos— para llegar a casi todo el personal.
      en: Tutored the workforce using the official risk-prevention materials, answering questions, expanding content and clarifying unclear points, in small groups. I also organised the training logistics — groups, schedules and shifts — to reach nearly all staff.

  - name:
      es: Iniciación a la realización radiofónica y al sonido profesional
      en: Introduction to radio production and professional sound
    year: 2009
    center:
      es: Aitiden Radio
      en: Aitiden Radio
    description:
      es: Formación a colaboradores de la emisora en realización de cabina, conceptos básicos de sonido profesional y manejo del equipamiento técnico.
      en: Training for the station's collaborators in control-room production, professional sound fundamentals and technical equipment handling.